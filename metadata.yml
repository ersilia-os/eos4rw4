Identifier: eos4rw4
Slug: cddd-onnx
Status: Ready
Title: Continuous and data-driven descriptor (CDDD)
Description: Encodes a molecule as 512 continuous descriptors taken from the 
  bottleneck of a translation network. Winter and colleagues trained a recurrent
  encoder-decoder to rewrite a randomised SMILES as the canonical SMILES of the 
  same structure, forcing the latent vector to carry the molecule rather than 
  the string, and pre-trained it on roughly 72 million compounds merged from 
  ZINC and PubChem. Ersilia serves the ONNX port of the encoder. Molecules it 
  cannot embed (invalid SMILES, non-organic, very small or very large compounds)
  return empty values.
