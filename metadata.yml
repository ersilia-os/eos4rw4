Task: Representation
Subtask: Featurization
Input:
  - Compound
Input Dimension: 1
Output:
  - Value
Output Dimension: 512
Output Consistency: Fixed
Interpretation: 512 continuous descriptors learned by translating between 
  molecular string representations. Empty values mean an invalid SMILES or a 
  molecule outside the encoders domain (atoms other than B, C, N, O, F, P, S, 
  Cl, Br, I; MW 12-600; 4-49 heavy atoms; logP -5 to 7).
